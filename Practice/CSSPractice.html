<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Practice</title>
    <style>
        body {
            background-color: #fff8e1;
            color: #000033;
        }
        h1 {
            color: brown;
            font-size: 2em;
            font-family: Arial, Verdana, sans-serif;
        }
        p {
            background-color: green;
            color: white;
        }
        ul {
            background-color: pink;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            color: purple;
        }
        ul li a {
            color: #5b2a86;
        }
        ul li a:hover {
            color: #ce1126;
        }
    </style>
</head>
<body>
    <h1>My Ugly CSS Text and Color Playground</h1>
    <p>This should be green with white text. I styled it with an internal rule.</p>
    <p style="background-color: blue;text-indent: 2em;">This should be blue and indented. I styled it inline, which overrides the internal rule.</p>
    <ul>
        <li><a href="https://www.w3schools.com/css/">W3Schools CSS Tutorial</a></li>
        <li><a href="https://developer.mozilla.org/en-US/docs/Learn/CSS/First_steps/Getting_started">MDN Getting Started with CSS</a></li>
        <li><a href="https://jigsaw.w3.org/css-validator/">W3C CSS Validator</a></li>
        <li><a href="https://www.color-hex.com/">Color Hex</a></li>
    </ul>
</body>
</html>
